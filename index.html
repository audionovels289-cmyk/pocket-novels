<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Novels - Read & Write Stories</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            --radius-lg: 20px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        header { position: sticky; top: 0; z-index: 100; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; width: 100%; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .logo i { font-size: 1.5rem; color: var(--primary-light); -webkit-text-fill-color: initial; }
        .search-container { position: relative; flex: 1; max-width: 300px; min-width: 200px; }
        .search-input { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); padding: 8px 14px 8px 36px; border-radius: 20px; color: #fff; font-size: 0.85rem; outline: none; }
        .search-input:focus { border-color: var(--primary); }
        .search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }
        .nav-links { display: flex; align-items: center; gap: 1rem; }
        .nav-item { color: var(--text-muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .nav-item.active { color: var(--primary-light); background: rgba(255, 255, 255, 0.05); }
        .user-badge { width: 38px; height: 38px; border-radius: 50%; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0; }
        .user-badge img { width: 100%; height: 100%; object-fit: cover; }
        main { flex: 1; padding: 1.5rem; max-width: 1200px; margin: 0 auto; width: 100%; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .genre-filters { display: flex; gap: 8px; overflow-x: auto; padding: 0.5rem 0 1.2rem 0; white-space: nowrap; scrollbar-width: none; }
        .genre-filters::-webkit-scrollbar { display: none; }
        .genre-tab { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; flex-shrink: 0; }
        .genre-tab.active { background: var(--gradient-primary); color: #fff; border-color: transparent; }
        .btn { background: var(--gradient-primary); color: #fff; border: none; padding: 10px 22px; border-radius: 20px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-secondary { background: var(--bg-card-hover); color: var(--text-main); }
        .studio-card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 2rem; max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
        .form-control { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; color: #fff; outline: none; }
        .file-upload-wrapper { border: 2px dashed var(--primary); padding: 1.5rem; text-align: center; border-radius: 12px; background: rgba(99, 102, 241, 0.05); cursor: pointer; margin-top: 6px; }
        .file-upload-wrapper input[type="file"] { display: none; }
        .preview-img { max-height: 180px; border-radius: 8px; margin-top: 10px; display: none; }
        .profile-card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 2rem; margin-bottom: 2rem; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .profile-pic { width: 90px; height: 90px; border-radius: 50%; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; overflow: hidden; flex-shrink: 0; }
        .profile-pic img { width: 100%; height: 100%; object-fit: cover; }
        .profile-details { flex: 1; min-width: 200px; }
        .profile-name { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
        .profile-bio { color: var(--text-muted); font-size: 0.9rem; line-height: 1.4; margin-bottom: 10px; }
        .auth-btn { background-color: rgba(255, 255, 255, 0.08); color: #e6edf3; border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .auth-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .auth-modal-content { background: #161b22; border: 1px solid rgba(255, 255, 255, 0.15); width: 90%; max-width: 380px; border-radius: 12px; padding: 24px; color: #e6edf3; }
        #appToast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #f8fafc; border: 1px solid var(--primary-light); padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; z-index: 10000; transition: transform 0.3s ease; opacity: 0; display: flex; align-items: center; gap: 10px; pointer-events: none; }
        #appToast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .novel-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; padding: 12px 0 !important; }
        .novel-card { background: #1e293b; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); position: relative; width: 100% !important; }
        .novel-cover { width: 100% !important; height: 140px !important; object-fit: cover !important; background: #334155; cursor: pointer; }
        .genre-badge { position: absolute; top: 10px; right: 10px; background: rgba(15, 23, 42, 0.85); color: var(--primary-light); padding: 3px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .lang-badge { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.85); color: var(--secondary); padding: 3px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .novel-info { padding: 0.8rem; flex: 1; cursor: pointer; }
        .novel-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .novel-author { font-size: 0.75rem; color: var(--primary-light); cursor: pointer; text-decoration: underline; display: inline-block; margin-bottom: 4px; }
        .novel-stats { font-size: 0.7rem; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDtlWzh0-qEfPzmT7dia5F4mnJ_oKsj5wA",
        authDomain: "pocket-novels-ec014.firebaseapp.com",
        projectId: "pocket-novels-ec014",
        storageBucket: "pocket-novels-ec014.firebasestorage.app",
        messagingSenderId: "136400612026",
        appId: "1:136400612026:web:cc5873486f06a5a1533083"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
    </script>
</head>
<body>

    <div id="appToast"><i class="fa-solid fa-circle-info" id="toastIcon"></i><span id="toastMessage">Notification</span></div>

    <header>
        <div class="logo" onclick="switchView('exploreView', true)">
            <i class="fa-solid fa-book-bookmark"></i>
            <span>Pocket Novels</span>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search novel, author..." onkeyup="applyFilters()">
        </div>
        <div class="nav-links">
            <div class="nav-item active" id="navExplore" onclick="switchView('exploreView', true)"><i class="fa-solid fa-compass"></i> <span>Explore</span></div>
            <div class="nav-item" id="navLibrary" onclick="switchView('libraryView', true)"><i class="fa-solid fa-bookmark"></i> <span>Library</span></div>
            <div class="nav-item" id="navStudio" onclick="switchView('studioView', true)"><i class="fa-solid fa-pen-nib"></i> <span>Publish</span></div>
            <button id="authBtn" class="auth-btn" onclick="handleAuthClick()"><i class="fa-brands fa-google"></i> Sign In</button>
            <div class="user-badge" id="headerAvatar" onclick="switchView('profileView', true)" title="My Profile">ME</div>
        </div>
    </header>

    <main>
        <section id="exploreView" class="view-section active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h2 style="margin:0;">Explore Novels</h2>
                <button class="btn btn-secondary" onclick="loadNovels()" style="padding: 6px 14px; font-size: 0.8rem;"><i class="fa-solid fa-rotate"></i> Refresh Feed</button>
            </div>
            <div class="genre-filters">
                <button class="genre-tab active" onclick="filterByGenre('All', this)">All</button>
                <button class="genre-tab" onclick="filterByGenre('Fantasy', this)">Fantasy</button>
                <button class="genre-tab" onclick="filterByGenre('Romance', this)">Romance</button>
                <button class="genre-tab" onclick="filterByGenre('Action', this)">Action</button>
            </div>
            <div class="novel-grid" id="novelGrid"></div>
        </section>

        <section id="detailView" class="view-section">
            <button class="btn btn-secondary" onclick="switchView('exploreView', true)" style="margin-bottom: 1.5rem;"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <div id="detailContainer"></div>
        </section>

        <section id="libraryView" class="view-section">
            <h2>Your Library Bookmarks</h2>
            <div class="novel-grid" id="libraryGrid"></div>
        </section>

        <section id="studioView" class="view-section">
            <div class="studio-card">
                <h2><i class="fa-solid fa-pen-fancy"></i> Writer's Studio</h2>
                <form id="publishForm" onsubmit="handlePublishNovel(event)">
                    <div class="form-group">
                        <label>Novel Title</label>
                        <input type="text" id="pubTitle" class="form-control" placeholder="Book title" required>
                    </div>
                    <div class="form-group">
                        <label>Genre</label>
                        <select id="pubGenre" class="form-control" style="background:#0f172a; color:#fff;">
                            <option value="Fantasy">Fantasy</option>
                            <option value="Romance">Romance</option>
                            <option value="Action">Action</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Cover Image</label>
                        <div class="file-upload-wrapper" onclick="document.getElementById('pubCoverFile').click()">
                            <i class="fa-solid fa-image" style="font-size: 2rem; color: var(--primary-light);"></i>
                            <p style="margin-top: 8px;">Tap to select image</p>
                            <input type="file" id="pubCoverFile" accept="image/*" onchange="previewGalleryImage(event)" required>
                            <img id="coverPreview" class="preview-img" alt="Preview">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Synopsis</label>
                        <textarea id="pubSynopsis" class="form-control" placeholder="Summary..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Chapter 1 Content</label>
                        <textarea id="pubEpContent" class="form-control" placeholder="Story text..." required></textarea>
                    </div>
                    <button type="submit" class="btn"><i class="fa-solid fa-cloud-arrow-up"></i> Publish Now</button>
                </form>
            </div>
        </section>

        <section id="profileView" class="view-section">
            <div class="profile-card">
                <div class="profile-pic" id="profilePicContainer"><span>ME</span></div>
                <div class="profile-details">
                    <div class="profile-name" id="profileNameDisplay">Guest User</div>
                    <div class="profile-bio" id="profileBioDisplay">Sign in to publish stories.</div>
                    <button class="btn btn-secondary" onclick="toggleEditProfile()" style="margin-top: 10px;"><i class="fa-solid fa-user-pen"></i> Edit Profile</button>
                </div>
            </div>
            <div class="studio-card" id="editProfileCard" style="display: none; margin-bottom: 2rem;">
                <h3>Edit Profile</h3>
                <form onsubmit="handleSaveProfile(event)" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label>Pen Name</label>
                        <input type="text" id="editNameInput" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="editBioInput" class="form-control"></textarea>
                    </div>
                    <button type="submit" class="btn">Save Profile</button>
                </form>
            </div>
            <h3>My Published Stories</h3>
            <div class="novel-grid" id="myPublishedGrid"></div>
        </section>
    </main>

    <div id="authModal" class="auth-modal-overlay" style="display: none;">
      <div class="auth-modal-content">
        <h3 style="margin-bottom:20px;">Sign In <span style="float:right; cursor:pointer;" onclick="closeAuthModal()">&times;</span></h3>
        <button class="btn" style="width:100%; background:#fff; color:#000; justify-content:center;" onclick="signInWithGoogle(); closeAuthModal();">
          <i class="fa-brands fa-google"></i> Continue with Google
        </button>
      </div>
    </div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('appToast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        let novels = [];
        let savedBookmarks = JSON.parse(localStorage.getItem('pocket_bookmarks')) || [];
        let userProfile = { name: "", bio: "", picture: "" };
        let currentUser = null;
        let uploadedCoverDataUrl = "";

        async function loadNovels() {
            try {
                const snap = await db.collection("publicNovels").get();
                novels = [];
                snap.forEach(doc => novels.push({ id: doc.id, ...doc.data() }));
                applyFilters();
                renderLibrary();
                renderProfileBooks();
            } catch (e) {
                console.error(e);
            }
        }
        loadNovels();

        firebase.auth().onAuthStateChanged(async (user) => {
            currentUser = user;
            const btn = document.getElementById('authBtn');
            if (user) {
                btn.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> Sign Out';
                userProfile = { name: user.displayName || "Author", bio: "", picture: user.photoURL || "" };
                try {
                    const doc = await db.collection("users").doc(user.uid).collection("appData").doc("profile").get();
                    if (doc.exists) userProfile = doc.data();
                } catch(e) {}
                updateProfileUI();
            } else {
                btn.innerHTML = '<i class="fa-brands fa-google"></i> Sign In';
                userProfile = { name: "", bio: "", picture: "" };
                updateProfileUI();
            }
        });

        function handleAuthClick() {
            if (currentUser) firebase.auth().signOut().then(() => window.location.reload());
            else document.getElementById('authModal').style.display = 'flex';
        }
        function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
        function signInWithGoogle() { firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        function updateProfileUI() {
            document.getElementById('profileNameDisplay').innerText = userProfile.name || "Guest User";
            document.getElementById('profileBioDisplay').innerText = userProfile.bio || "No bio added.";
            const av = document.getElementById('headerAvatar');
            if (userProfile.picture) av.innerHTML = `<img src="${userProfile.picture}">`;
            else av.innerHTML = `<span>${(userProfile.name || "G").substring(0,2).toUpperCase()}</span>`;
        }

        function toggleEditProfile() {
            if (!currentUser) { document.getElementById('authModal').style.display = 'flex'; return; }
            const c = document.getElementById('editProfileCard');
            c.style.display = c.style.display === 'none' ? 'block' : 'none';
            document.getElementById('editNameInput').value = userProfile.name;
            document.getElementById('editBioInput').value = userProfile.bio;
        }

        async function handleSaveProfile(e) {
            e.preventDefault();
            userProfile.name = document.getElementById('editNameInput').value;
            userProfile.bio = document.getElementById('editBioInput').value;
            await db.collection("users").doc(currentUser.uid).collection("appData").doc("profile").set(userProfile);
            updateProfileUI();
            toggleEditProfile();
            showToast("Profile saved!");
        }

        function previewGalleryImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 300; canvas.height = 400;
                        canvas.getContext('2d').drawImage(img, 0, 0, 300, 400);
                        uploadedCoverDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        const p = document.getElementById('coverPreview');
                        p.src = uploadedCoverDataUrl; p.style.display = 'block';
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        async function handlePublishNovel(e) {
            e.preventDefault();
            if (!currentUser) { document.getElementById('authModal').style.display = 'flex'; return; }
            if (!uploadedCoverDataUrl) { showToast("Select a cover image!"); return; }

            const id = Date.now().toString();
            const novel = {
                id,
                title: document.getElementById('pubTitle').value,
                genre: document.getElementById('pubGenre').value,
                author: userProfile.name,
                cover: uploadedCoverDataUrl,
                synopsis: document.getElementById('pubSynopsis').value,
                views: 0,
                chapters: [{ title: "Chapter 1", content: document.getElementById('pubEpContent').value }]
            };

            await db.collection("publicNovels").doc(id).set(novel);
            showToast("Published!");
            document.getElementById('publishForm').reset();
            document.getElementById('coverPreview').style.display = 'none';
            uploadedCoverDataUrl = "";
            loadNovels();
            switchView('exploreView', true);
        }

        function switchView(id, save = false) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (save) localStorage.setItem('last_view', id);
        }

        function filterByGenre(g, el) {
            document.querySelectorAll('.genre-tab').forEach(t => t.classList.remove('active'));
            if(el) el.classList.add('active');
            renderGrid(g === 'All' ? novels : novels.filter(n => n.genre === g), 'novelGrid');
        }

        function applyFilters() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderGrid(novels.filter(n => n.title.toLowerCase().includes(q) || n.author.toLowerCase().includes(q)), 'novelGrid');
        }

        function renderGrid(data, target) {
            const grid = document.getElementById(target);
            if (!grid) return;
            if (data.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted); grid-column:1/-1;">No novels found in database. Publish your first book!</p>`;
                return;
            }
            grid.innerHTML = data.map(n => `
                <div class="novel-card">
                    <span class="genre-badge">${n.genre}</span>
                    <img class="novel-cover" src="${n.cover}">
                    <div class="novel-info">
                        <div class="novel-title">${n.title}</div>
                        <span class="novel-author">By ${n.author}</span>
                        <div class="novel-stats"><i class="fa-solid fa-eye"></i> ${n.views || 0} views</div>
                    </div>
                </div>
            `).join('');
        }

        function renderLibrary() { renderGrid(novels.filter(n => savedBookmarks.includes(n.id)), 'libraryGrid'); }
        function renderProfileBooks() {
            if (!currentUser) return;
            renderGrid(novels.filter(n => n.author === userProfile.name), 'myPublishedGrid');
        }

        switchView(localStorage.getItem('last_view') || 'exploreView');
    </script>
</body>
</html>
